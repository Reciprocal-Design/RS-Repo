<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Driftloop</title>
<meta name="description" content="A looping orb animation tool — tune speed and range, recolor each sphere, and export a seamless video loop.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,440;9..144,600;9..144,700&family=Manrope:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  html { color-scheme: light dark; }
  body { margin: 0; font-size: 14px; }
  img { max-width: 100%; }
  [hidden] { display: none !important; }

  :root {
    --bg: #f0ece2;
    --surface: #ffffff;
    --surface-2: #e8e1d1;
    --border: #d9d0ba;
    --text: #211e17;
    --text-dim: #746c5b;
    --accent: #c17a20;
    --accent-strong: #a4670f;
    --accent-text: #fffaf0;
    --shadow: rgba(33, 28, 16, 0.14);
    --focus: #a4670f;
    --check-a: #ffffff;
    --check-b: #e9e4d8;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #16140f;
      --surface: #201c14;
      --surface-2: #2a2418;
      --border: #3c3421;
      --text: #f1ecdf;
      --text-dim: #a89c81;
      --accent: #e2a53f;
      --accent-strong: #f0b957;
      --accent-text: #211a0a;
      --shadow: rgba(0, 0, 0, 0.45);
      --focus: #e2a53f;
      --check-a: #242018;
      --check-b: #1a1712;
    }
  }

  :root[data-theme="dark"] {
    --bg: #16140f;
    --surface: #201c14;
    --surface-2: #2a2418;
    --border: #3c3421;
    --text: #f1ecdf;
    --text-dim: #a89c81;
    --accent: #e2a53f;
    --accent-strong: #f0b957;
    --accent-text: #211a0a;
    --shadow: rgba(0, 0, 0, 0.45);
    --focus: #e2a53f;
    --check-a: #242018;
    --check-b: #1a1712;
  }

  * { box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: "Manrope", ui-sans-serif, system-ui, sans-serif;
    padding: 28px 20px 48px;
    min-height: 100vh;
  }

  .app {
    max-width: 1200px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    gap: 22px;
  }

  header {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  h1 {
    font-family: "Fraunces", Georgia, serif;
    font-optical-sizing: auto;
    font-weight: 600;
    font-size: clamp(1.7rem, 1.3rem + 1.6vw, 2.5rem);
    letter-spacing: -0.01em;
    margin: 0;
    text-wrap: balance;
  }

  .tagline {
    margin: 0;
    color: var(--text-dim);
    font-size: 0.98rem;
    max-width: 46ch;
  }

  main {
    display: grid;
    grid-template-columns: minmax(0, 1.35fr) minmax(260px, 0.85fr);
    gap: 20px;
    align-items: start;
  }

  @media (max-width: 760px) {
    main { grid-template-columns: 1fr; }
  }

  .stage-wrap {
    position: relative;
    width: 100%;
    aspect-ratio: 1 / 1;
    max-width: 780px;
    margin: 0 auto;
    border-radius: 22px;
    overflow: hidden;
    background: var(--surface);
    border: 1px solid var(--border);
    box-shadow: 0 18px 44px -22px var(--shadow);
  }

  canvas#stage {
    display: block;
    width: 100%;
    height: 100%;
  }

  .rec-badge {
    position: absolute;
    top: 14px;
    left: 14px;
    display: flex;
    align-items: center;
    gap: 7px;
    padding: 6px 12px 6px 10px;
    border-radius: 999px;
    background: rgba(20, 16, 8, 0.72);
    color: #fff4e0;
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-size: 0.78rem;
    letter-spacing: 0.02em;
    backdrop-filter: blur(4px);
  }

  .rec-badge[hidden] { display: none; }

  .rec-badge .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #ef4d4d;
  }

  @media (prefers-reduced-motion: no-preference) {
    .rec-badge .dot { animation: pulse 1.1s ease-in-out infinite; }
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.35; }
  }

  .rail {
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .control-group {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 16px 18px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .control-row {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 10px;
  }

  .control-row label,
  .group-label {
    font-size: 0.72rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--text-dim);
  }

  output {
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-variant-numeric: tabular-nums;
    font-size: 0.9rem;
    color: var(--text);
  }

  input[type="range"] {
    width: 100%;
    accent-color: var(--accent);
    height: 22px;
  }

  select {
    width: 100%;
    background: var(--surface-2);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 9px;
    padding: 9px 10px;
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-size: 0.88rem;
  }

  .swatch-row {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 10px;
  }

  .swatch {
    display: flex;
    align-items: center;
    gap: 9px;
    padding: 7px 9px;
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 10px;
    cursor: pointer;
  }

  .swatch input[type="color"] {
    appearance: none;
    -webkit-appearance: none;
    width: 26px;
    height: 26px;
    border-radius: 50%;
    border: 1px solid var(--border);
    padding: 0;
    background: none;
    flex: none;
    cursor: pointer;
  }
  .swatch input[type="color"]::-webkit-color-swatch-wrapper { padding: 0; border-radius: 50%; }
  .swatch input[type="color"]::-webkit-color-swatch { border: none; border-radius: 50%; }
  .swatch input[type="color"]::-moz-color-swatch { border: none; border-radius: 50%; }

  .swatch span {
    font-size: 0.82rem;
    color: var(--text);
  }

  .swatch:has(input:disabled) { opacity: 0.45; cursor: default; }

  .toggle {
    display: flex;
    align-items: center;
    gap: 9px;
    font-size: 0.82rem;
    color: var(--text);
    cursor: pointer;
  }
  .toggle input {
    width: 16px;
    height: 16px;
    margin: 0;
    accent-color: var(--accent);
    cursor: pointer;
  }

  /* shows through wherever the canvas is left clear */
  .stage-wrap.is-transparent {
    background: repeating-conic-gradient(var(--check-a) 0 25%, var(--check-b) 0 50%) 50% / 24px 24px;
  }

  button#exportBtn {
    appearance: none;
    border: none;
    border-radius: 11px;
    padding: 12px 16px;
    background: var(--accent);
    color: var(--accent-text);
    font-family: "Manrope", sans-serif;
    font-weight: 700;
    font-size: 0.94rem;
    cursor: pointer;
  }
  button#exportBtn:hover:not(:disabled) { background: var(--accent-strong); }
  button#exportBtn:disabled { opacity: 0.55; cursor: default; }

  button#cancelBtn {
    appearance: none;
    border: 1px solid var(--border);
    border-radius: 11px;
    padding: 10px 16px;
    background: transparent;
    color: var(--text);
    font-family: "Manrope", sans-serif;
    font-weight: 600;
    font-size: 0.88rem;
    cursor: pointer;
  }

  @media (prefers-reduced-motion: no-preference) {
    button, input[type="color"], .swatch { transition: background 0.15s ease, opacity 0.15s ease; }
  }

  .stack {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .hint {
    margin: 2px 0 0;
    font-size: 0.78rem;
    color: var(--text-dim);
    line-height: 1.4;
  }

  :focus-visible {
    outline: 2px solid var(--focus);
    outline-offset: 2px;
  }

  .sr-only {
    position: absolute;
    width: 1px; height: 1px;
    overflow: hidden;
    clip: rect(0 0 0 0);
    white-space: nowrap;
  }
</style>
</head>

<body>
<div class="app">
  <header>
    <h1>Driftloop</h1>
    <p class="tagline">Three spheres swing, orbit, and drift apart on a seamless loop. Tune the motion, recolor the set, export a clip.</p>
  </header>

  <main>
    <div class="stage-wrap">
      <canvas id="stage"></canvas>
      <div class="rec-badge" id="recBadge" hidden>
        <span class="dot"></span>
        <span id="recTime">0.0s</span> / <span id="recTotal">0.0s</span>
      </div>
    </div>

    <aside class="rail">
      <section class="control-group">
        <div class="control-row">
          <label for="speedSlider">Speed</label>
          <output id="speedValue" for="speedSlider">1.00×</output>
        </div>
        <input type="range" id="speedSlider" min="25" max="300" step="5" value="100">
      </section>

      <section class="control-group">
        <div class="control-row">
          <label for="rangeSlider">Range</label>
          <output id="rangeValue" for="rangeSlider">170 px</output>
        </div>
        <input type="range" id="rangeSlider" min="0" max="340" step="5" value="170">
      </section>

      <section class="control-group colors">
        <span class="group-label">Colors</span>
        <div class="swatch-row">
          <label class="swatch">
            <input type="color" id="colorA" value="#2b2566">
            <span>Sphere 1</span>
          </label>
          <label class="swatch">
            <input type="color" id="colorB" value="#f0c94a">
            <span>Sphere 2</span>
          </label>
          <label class="swatch">
            <input type="color" id="colorC" value="#4ea8de">
            <span>Sphere 3</span>
          </label>
          <label class="swatch">
            <input type="color" id="colorBg" value="#edece6">
            <span>Background</span>
          </label>
        </div>
        <label class="toggle">
          <input type="checkbox" id="transparentBg">
          <span>Transparent background</span>
        </label>
      </section>

      <section class="control-group export">
        <div class="control-row">
          <label for="formatSelect">Format</label>
          <output id="formatNote" for="formatSelect">—</output>
        </div>
        <select id="formatSelect">
          <option value="mp4">MP4 video</option>
          <option value="webm">WebM video</option>
          <option value="html">HTML page</option>
        </select>

        <div class="stack" id="videoOptions">
          <div class="control-row">
            <label for="loopsSelect">Loops to export</label>
            <output id="durationValue" for="loopsSelect">10.0s</output>
          </div>
          <select id="loopsSelect">
            <option value="1">1 loop</option>
            <option value="2" selected>2 loops</option>
            <option value="3">3 loops</option>
            <option value="4">4 loops</option>
            <option value="6">6 loops</option>
            <option value="8">8 loops</option>
          </select>
        </div>
        <button id="exportBtn" type="button" disabled>Loading exporter…</button>
        <button id="cancelBtn" type="button" hidden>Cancel recording</button>
        <p class="hint" id="exportHint">Recording locks the controls so the exported clip loops perfectly.</p>
      </section>
    </aside>
  </main>
  <div class="sr-only" id="statusLive" aria-live="polite"></div>
</div>

<script>
(function () {
  "use strict";

  var canvas = document.getElementById("stage");
  var ctx = canvas.getContext("2d");
  var stageWrap = canvas.parentElement;
  var recBadge = document.getElementById("recBadge");
  var recTimeEl = document.getElementById("recTime");
  var recTotalEl = document.getElementById("recTotal");
  var statusLive = document.getElementById("statusLive");

  var speedSlider = document.getElementById("speedSlider");
  var speedValue = document.getElementById("speedValue");
  var rangeSlider = document.getElementById("rangeSlider");
  var rangeValue = document.getElementById("rangeValue");
  var loopsSelect = document.getElementById("loopsSelect");
  var durationValue = document.getElementById("durationValue");
  var formatSelect = document.getElementById("formatSelect");
  var formatNote = document.getElementById("formatNote");
  var videoOptions = document.getElementById("videoOptions");
  var exportBtn = document.getElementById("exportBtn");
  var cancelBtn = document.getElementById("cancelBtn");
  var exportHint = document.getElementById("exportHint");

  var colorInputs = {
    a: document.getElementById("colorA"),
    b: document.getElementById("colorB"),
    c: document.getElementById("colorC"),
    bg: document.getElementById("colorBg")
  };

  var transparentBg = document.getElementById("transparentBg");

  var railInputs = [speedSlider, rangeSlider, loopsSelect, formatSelect, transparentBg,
    colorInputs.a, colorInputs.b, colorInputs.c, colorInputs.bg];

  // ---- motion model -------------------------------------------------
  // Each sphere orbits the shared centroid at its own turn count and
  // direction while breathing in and out, with a second harmonic layered
  // on both the radius and the angle so the motion never repeats the
  // same shape twice within a cycle. Every frequency used is an integer
  // multiple of the base phase, so the whole thing still closes exactly
  // after one period — the export stays seamlessly loopable.
  // Each sphere circles a home point of its own, on a plane tilted by an
  // inclination and swung round by a node angle. The home points breathe
  // toward and away from the centre on staggered timing. Keeping the homes
  // apart is what makes them gather into a cluster instead of stacking:
  // orbits that all shared the origin put every sphere through the same
  // point, and whoever arrived nearest simply eclipsed the rest.
  var SPHERES = [
    { key: "a", radiusFrac: 0.175, home: [0.33, -0.94, 0.35], homeDist: 1.00,
      orbitRadius: 0.34, orbitTurns: 1, wobblePhase: 0.00, angleWobble: 0.55,
      inclination: 1.05, node: 0.35, breathePhase: -0.45 },
    { key: "b", radiusFrac: 0.135, home: [-0.60, -0.38, -0.55], homeDist: 0.78,
      orbitRadius: 0.42, orbitTurns: -1, wobblePhase: 2.15, angleWobble: 0.75,
      inclination: -1.28, node: 2.10, breathePhase: 0.00 },
    { key: "c", radiusFrac: 0.175, home: [0.23, 0.35, 0.45], homeDist: 0.66,
      orbitRadius: 0.37, orbitTurns: 2, wobblePhase: 4.25, angleWobble: 0.45,
      inclination: 0.95, node: 4.05, breathePhase: 0.45 }
  ];
  // How far in the homes are allowed to draw at their tightest. Below about
  // a third, the cluster collapses back into an eclipse.
  var CLUSTER_MIN = 0.35;
  var BREATHE_WOBBLE = 0.07;
  var FOCAL_REF = 620; // camera distance in reference units — near enough
                       // that depth reads as a ~1.4x swing in apparent size

  (function normalizeHomes() {
    for (var i = 0; i < SPHERES.length; i++) {
      var h = SPHERES[i].home;
      var m = Math.sqrt(h[0] * h[0] + h[1] * h[1] + h[2] * h[2]);
      SPHERES[i].home = [h[0] / m, h[1] / m, h[2] / m];
    }
  })();
  var REF_STAGE = 600;
  var BASE_PERIOD = 5; // seconds, at 1.00x speed
  // Opens on a balanced frame where the three sit at visibly different
  // depths and overlap, so the layering reads at a glance. A constant
  // offset doesn't touch the cycle length, so loops still close.
  var PHASE_OFFSET = 0.959;

  var state = {
    speed: 1.0,
    range: 170,
    transparent: false,
    colors: {
      a: colorInputs.a.value,
      b: colorInputs.b.value,
      c: colorInputs.c.value,
      bg: colorInputs.bg.value
    }
  };

  function currentPeriod() { return BASE_PERIOD / state.speed; }

  function refreshReadouts() {
    speedValue.textContent = state.speed.toFixed(2) + "×";
    rangeValue.textContent = state.range + " px";
    var loops = parseInt(loopsSelect.value, 10);
    durationValue.textContent = (currentPeriod() * loops).toFixed(1) + "s";
  }

  speedSlider.addEventListener("input", function () {
    state.speed = parseInt(speedSlider.value, 10) / 100;
    refreshReadouts();
  });
  rangeSlider.addEventListener("input", function () {
    state.range = parseInt(rangeSlider.value, 10);
    refreshReadouts();
  });
  loopsSelect.addEventListener("change", refreshReadouts);
  colorInputs.a.addEventListener("input", function () { state.colors.a = colorInputs.a.value; });
  colorInputs.b.addEventListener("input", function () { state.colors.b = colorInputs.b.value; });
  colorInputs.c.addEventListener("input", function () { state.colors.c = colorInputs.c.value; });
  colorInputs.bg.addEventListener("input", function () { state.colors.bg = colorInputs.bg.value; });

  function syncTransparency() {
    state.transparent = transparentBg.checked;
    stageWrap.classList.toggle("is-transparent", state.transparent);
    colorInputs.bg.disabled = state.transparent || recording;
    refreshFormat();
  }
  transparentBg.addEventListener("change", syncTransparency);

  refreshReadouts();

  // ---- canvas sizing --------------------------------------------------
  var cssW = 0, cssH = 0, spriteDpr = 1;

  function fitCanvas() {
    // the canvas itself, not its bordered wrapper — measuring the wrapper
    // sizes the backing store 2px larger than the box it draws into
    var rect = canvas.getBoundingClientRect();
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    spriteDpr = dpr;
    cssW = rect.width;
    cssH = rect.height;
    canvas.width = Math.max(1, Math.round(cssW * dpr));
    canvas.height = Math.max(1, Math.round(cssH * dpr));
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  fitCanvas();
  if (window.ResizeObserver) {
    new ResizeObserver(fitCanvas).observe(stageWrap);
  } else {
    window.addEventListener("resize", fitCanvas);
  }

  // ---- color mixing -----------------------------------------------
  function hexToRgb(hex) {
    hex = hex.replace("#", "");
    if (hex.length === 3) hex = hex.split("").map(function (c) { return c + c; }).join("");
    var num = parseInt(hex, 16);
    return [(num >> 16) & 255, (num >> 8) & 255, num & 255];
  }

  function mix(hex, targetHex, t) {
    var a = hexToRgb(hex), b = hexToRgb(targetHex);
    var r = Math.round(a[0] + (b[0] - a[0]) * t);
    var g = Math.round(a[1] + (b[1] - a[1]) * t);
    var bl = Math.round(a[2] + (b[2] - a[2]) * t);
    return "rgb(" + r + "," + g + "," + bl + ")";
  }

  // ---- sphere rendering ---------------------------------------------
  // A sphere's shading never changes as it moves, so each one is drawn
  // once into its own transparent layer and then blitted per frame. The
  // layer is also what makes the feathered silhouette possible: erasing
  // the rim would punch through the background on the shared canvas.
  var SPRITE_PAD = 2;
  var spriteCanvases = [];
  var spriteKeys = [];

  function makeSphereSprite(r, hex, dpr) {
    var span = r + SPRITE_PAD;
    var c = document.createElement("canvas");
    c.width = Math.max(1, Math.ceil(span * 2 * dpr));
    c.height = c.width;
    var g = c.getContext("2d");
    g.scale(dpr, dpr);
    var cx = span, cy = span;

    // Body — light enters from the upper right, so the tint stays washed
    // out there and gathers into the lower-left rim. Offsetting the
    // gradient origin (rather than shading concentrically) is what keeps
    // it reading as a lit volume instead of a printed disc.
    var ox = cx + r * 0.24, oy = cy - r * 0.28;
    var body = g.createRadialGradient(ox, oy, r * 0.02, ox, oy, r * 1.37);
    body.addColorStop(0.00, mix(hex, "#ffffff", 0.94));
    body.addColorStop(0.30, mix(hex, "#ffffff", 0.87));
    body.addColorStop(0.50, mix(hex, "#ffffff", 0.79));
    body.addColorStop(0.75, mix(hex, "#ffffff", 0.64));
    body.addColorStop(0.92, mix(hex, "#ffffff", 0.50));
    body.addColorStop(1.00, mix(hex, "#ffffff", 0.42));
    g.beginPath();
    g.arc(cx, cy, r, 0, Math.PI * 2);
    g.fillStyle = body;
    g.fill();

    g.save();
    g.beginPath();
    g.arc(cx, cy, r, 0, Math.PI * 2);
    g.clip();

    // Light pooling low in the body, the way it does inside frosted glass.
    var bx = cx + r * 0.05, by = cy + r * 0.38;
    var bloom = g.createRadialGradient(bx, by, 0, bx, by, r * 0.80);
    bloom.addColorStop(0, "rgba(255,255,255,0.44)");
    bloom.addColorStop(0.55, "rgba(255,255,255,0.15)");
    bloom.addColorStop(1, "rgba(255,255,255,0)");
    g.fillStyle = bloom;
    g.fillRect(cx - r, cy - r, r * 2, r * 2);

    // A whisper of sheen on the lit shoulder — enough to read as glass.
    var sx = cx + r * 0.20, sy = cy - r * 0.34;
    var sheen = g.createRadialGradient(sx, sy, 0, sx, sy, r * 0.85);
    sheen.addColorStop(0, "rgba(255,255,255,0.20)");
    sheen.addColorStop(1, "rgba(255,255,255,0)");
    g.fillStyle = sheen;
    g.fillRect(cx - r, cy - r, r * 2, r * 2);
    g.restore();

    // Feathered silhouette: a glass edge falls away, it doesn't cut.
    g.globalCompositeOperation = "destination-out";
    var feather = g.createRadialGradient(cx, cy, r * 0.88, cx, cy, r);
    feather.addColorStop(0, "rgba(0,0,0,0)");
    feather.addColorStop(0.7, "rgba(0,0,0,0.04)");
    feather.addColorStop(1, "rgba(0,0,0,0.5)");
    g.fillStyle = feather;
    g.fillRect(0, 0, span * 2, span * 2);

    return c;
  }

  function sphereSprite(index, r, hex) {
    var key = hex + "|" + r + "|" + spriteDpr;
    if (spriteKeys[index] !== key) {
      spriteCanvases[index] = makeSphereSprite(r, hex, spriteDpr);
      spriteKeys[index] = key;
    }
    return spriteCanvases[index];
  }

  function spherePosition(sph, phase, rangePx) {
    // the together-and-apart sweep, offset per sphere so they don't all
    // draw in on the same beat
    var breathe = CLUSTER_MIN +
      (1 - CLUSTER_MIN) * (0.5 + 0.5 * Math.sin(phase + sph.breathePhase)) +
      BREATHE_WOBBLE * Math.sin(phase * 3 + sph.wobblePhase);

    var theta = sph.wobblePhase + sph.orbitTurns * phase +
      sph.angleWobble * Math.sin(phase * 2 + sph.wobblePhase);

    // the local orbit, traced flat then tilted into the scene
    var orbit = sph.orbitRadius * rangePx;
    var px = Math.cos(theta) * orbit;
    var py = Math.sin(theta) * orbit;
    var ci = Math.cos(sph.inclination), si = Math.sin(sph.inclination);
    var y1 = py * ci, z1 = py * si;
    var cn = Math.cos(sph.node), sn = Math.sin(sph.node);

    var hd = sph.homeDist * rangePx * breathe;
    return {
      x: sph.home[0] * hd + px * cn + z1 * sn,
      y: sph.home[1] * hd + y1,
      z: sph.home[2] * hd - px * sn + z1 * cn
    };
  }

  function perspective(z, focal) {
    return focal / Math.max(focal * 0.25, focal - z);
  }

  // Perspective makes reach impossible to solve in closed form, so walk the
  // cycle once and measure it. Also yields each sphere's largest on-screen
  // radius, which is the size its sprite gets drawn at — everything nearer
  // the back is a cheap downscale of that same bitmap.
  var layoutCache = { key: "", fit: 1, maxRadius: [], kMin: 1, kMax: 1 };

  function layoutFor(S, rangePx) {
    var key = Math.round(S) + "|" + Math.round(rangePx * 10);
    if (layoutCache.key === key) return layoutCache;

    var focal = FOCAL_REF * (S / REF_STAGE);
    var worst = 0, kMin = Infinity, kMax = 0;
    var maxR = [];
    var i;
    for (i = 0; i < SPHERES.length; i++) maxR[i] = 0;

    for (var step = 0; step < 720; step++) {
      var p = (step / 720) * Math.PI * 2;
      for (i = 0; i < SPHERES.length; i++) {
        var sph = SPHERES[i];
        var w = spherePosition(sph, p, rangePx);
        var k = perspective(w.z, focal);
        var sr = S * sph.radiusFrac * k;
        var reach = Math.sqrt(w.x * w.x + w.y * w.y) * k + sr;
        if (reach > worst) worst = reach;
        if (sr > maxR[i]) maxR[i] = sr;
        if (k < kMin) kMin = k;
        if (k > kMax) kMax = k;
      }
    }

    var safe = S * 0.48;
    var fit = worst > safe ? safe / worst : 1;
    for (i = 0; i < SPHERES.length; i++) {
      maxR[i] = Math.max(4, Math.round(maxR[i] * fit));
    }
    layoutCache.key = key;
    layoutCache.fit = fit;
    layoutCache.maxRadius = maxR;
    layoutCache.kMin = kMin;
    layoutCache.kMax = kMax;
    return layoutCache;
  }

  function draw(elapsedSec) {
    if (cssW === 0) return;
    ctx.clearRect(0, 0, cssW, cssH);
    if (!state.transparent || opaqueRecording) {
      ctx.fillStyle = state.colors.bg;
      ctx.fillRect(0, 0, cssW, cssH);
    }

    var S = Math.min(cssW, cssH);
    var cx0 = cssW / 2, cy0 = cssH / 2;
    var omega = (2 * Math.PI / BASE_PERIOD) * state.speed;
    var phase = elapsedSec * omega + PHASE_OFFSET;
    var rangePx = state.range * (S / REF_STAGE);
    var layout = layoutFor(S, rangePx);
    var focal = FOCAL_REF * (S / REF_STAGE);
    var kSpread = layout.kMax - layout.kMin;

    var order = [];
    for (var i = 0; i < SPHERES.length; i++) {
      var sph = SPHERES[i];
      var w = spherePosition(sph, phase, rangePx);
      var k = perspective(w.z, focal);
      order.push({
        index: i,
        z: w.z,
        x: cx0 + w.x * k * layout.fit,
        y: cy0 + w.y * k * layout.fit,
        radius: S * sph.radiusFrac * k * layout.fit,
        depth: kSpread > 0 ? (k - layout.kMin) / kSpread : 1
      });
    }
    // Farthest first — whichever sphere is nearest the camera lands on top.
    order.sort(function (m, n) { return m.z - n.z; });

    for (var d = 0; d < order.length; d++) {
      var item = order[d];
      var maxR = layout.maxRadius[item.index];
      var sprite = sphereSprite(item.index, maxR, state.colors[SPHERES[item.index].key]);
      var span = (maxR + SPRITE_PAD) * (item.radius / maxR);
      // A touch of haze on the far ones; the near one stays fully present.
      ctx.globalAlpha = 0.84 + 0.16 * item.depth;
      ctx.drawImage(sprite, item.x - span, item.y - span, span * 2, span * 2);
    }
    ctx.globalAlpha = 1;
  }

  // ---- animation loop ----------------------------------------------
  var startTime = performance.now();
  var recording = false;
  // Browsers record MP4 without an alpha channel, so a transparent
  // MP4 would come out black where it's clear. Paint the colour instead.
  var opaqueRecording = false;
  var recStartTime = 0;
  var recTargetMs = 0;

  function tick(now) {
    var elapsedSec = (now - startTime) / 1000;
    draw(elapsedSec);
    if (recording) {
      var recElapsed = (now - recStartTime) / 1000;
      recTimeEl.textContent = Math.min(recElapsed, recTargetMs / 1000).toFixed(1) + "s";
    }
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);

  // ---- export via downloads capability ------------------------------
  var downloadsCap = null;
  var downloadsReady = false;

  function setRailDisabled(disabled) {
    railInputs.forEach(function (el) { el.disabled = disabled; });
    if (!disabled) colorInputs.bg.disabled = state.transparent;
  }

  // Inside the Claude artifact viewer the sandbox blocks downloads a page
  // starts itself, so saving has to go through the host. Served as an
  // ordinary page there is no host — and no sandbox — so a blob link works.
  function nativeSave(request) {
    var blob = request.data instanceof Blob ? request.data : new Blob([request.data]);
    var url = URL.createObjectURL(blob);
    var link = document.createElement("a");
    link.href = url;
    link.download = request.filename;
    document.body.appendChild(link);
    link.click();
    link.remove();
    setTimeout(function () { URL.revokeObjectURL(url); }, 10000);
    return Promise.resolve({ status: "saved" });
  }

  function initDownloads() {
    function settle(cap) {
      downloadsCap = cap || null;
      downloadsReady = true;
      if (!downloadsCap) exportHint.textContent = "This view can't offer file downloads.";
      updateExportButton();
    }
    if (!window.claude || typeof window.claude.use !== "function") {
      settle({ save: nativeSave });
      return;
    }
    window.claude.use("downloads").then(settle).catch(function () { settle(null); });
  }

  // H.264 first: it's the MP4 every editor and phone will open. Browsers
  // built without it still mux MP4 using VP9 or AV1, which is a real .mp4
  // but not one every app reads — hence the caveat after saving.
  var FORMATS = {
    html: {
      label: "HTML",
      ext: "html",
      video: false
    },
    mp4: {
      label: "MP4",
      ext: "mp4",
      video: true,
      candidates: [
        "video/mp4;codecs=avc1.640028",
        "video/mp4;codecs=avc1.42E01E",
        "video/mp4;codecs=avc1",
        "video/mp4;codecs=h264",
        "video/mp4"
      ]
    },
    webm: {
      label: "WebM",
      ext: "webm",
      video: true,
      candidates: [
        "video/webm;codecs=vp9",
        "video/webm;codecs=vp8",
        "video/webm"
      ]
    }
  };

  function supportedMime(formatKey) {
    if (!FORMATS[formatKey].video) return null;
    if (!window.MediaRecorder) return null;
    var list = FORMATS[formatKey].candidates;
    for (var i = 0; i < list.length; i++) {
      if (MediaRecorder.isTypeSupported(list[i])) return list[i];
    }
    return null;
  }

  // null when the browser accepted a bare container and picked for itself.
  function codecLabel(mimeType) {
    if (mimeType.indexOf("avc1") !== -1 || mimeType.indexOf("h264") !== -1) return "H.264";
    if (mimeType.indexOf("av01") !== -1) return "AV1";
    if (mimeType.indexOf("vp9") !== -1) return "VP9";
    if (mimeType.indexOf("vp8") !== -1) return "VP8";
    return null;
  }

  function updateExportButton() {
    if (recording) return;
    var format = FORMATS[formatSelect.value];
    if (!downloadsReady) {
      exportBtn.disabled = true;
      exportBtn.textContent = "Loading exporter…";
    } else if (!downloadsCap) {
      exportBtn.disabled = true;
      exportBtn.textContent = "Export unavailable here";
    } else if (format.video && !supportedMime(formatSelect.value)) {
      exportBtn.disabled = true;
      exportBtn.textContent = format.label + " unavailable here";
    } else {
      exportBtn.disabled = false;
      exportBtn.textContent = "Export " + format.label;
    }
  }

  function refreshFormat() {
    var format = FORMATS[formatSelect.value];
    videoOptions.hidden = !format.video;
    if (format.video) {
      var mime = supportedMime(formatSelect.value);
      var note = mime ? (codecLabel(mime) || "browser default") : "unavailable";
      if (mime && state.transparent) note += format.ext === "webm" ? " + alpha" : ", no alpha";
      formatNote.textContent = note;
      if (state.transparent && format.ext !== "webm") {
        exportHint.textContent = "Browsers can't record transparent MP4, so this clip will sit on the background colour. Pick WebM for a transparent video.";
      } else if (state.transparent) {
        exportHint.textContent = "WebM keeps the transparency, ready to layer in an editor. Recording locks the controls so the clip loops perfectly.";
      } else {
        exportHint.textContent = "Recording locks the controls so the exported clip loops perfectly.";
      }
    } else {
      formatNote.textContent = "self-contained";
      exportHint.textContent = state.transparent
        ? "A standalone page of the animation on a transparent background — drop it over anything."
        : "A standalone page of the animation at these exact settings — one file, no controls.";
    }
    updateExportButton();
  }

  formatSelect.addEventListener("change", refreshFormat);

  (function initFormats() {
    var mp4Ok = !!supportedMime("mp4");
    var webmOk = !!supportedMime("webm");
    formatSelect.querySelector('option[value="mp4"]').disabled = !mp4Ok;
    formatSelect.querySelector('option[value="webm"]').disabled = !webmOk;
    if (!mp4Ok) formatSelect.value = webmOk ? "webm" : "html";
    refreshFormat();
  })();

  syncTransparency();
  initDownloads();

  var activeRecorder = null;
  var activeStream = null;
  var cancelled = false;

  var EXPORT_RUNTIME = "var canvas = document.getElementById(\"driftloop\");\nvar ctx = canvas.getContext(\"2d\");\nvar cssW = 0, cssH = 0, spriteDpr = 1;\nvar spriteCanvases = [], spriteKeys = [];\n\nfunction sphereSprite(index, r, hex) {\n  var key = hex + \"|\" + r + \"|\" + spriteDpr;\n  if (spriteKeys[index] !== key) {\n    spriteCanvases[index] = makeSphereSprite(r, hex, spriteDpr);\n    spriteKeys[index] = key;\n  }\n  return spriteCanvases[index];\n}\n\nfunction fitCanvas() {\n  var dpr = Math.min(window.devicePixelRatio || 1, 2);\n  spriteDpr = dpr;\n  var rect = canvas.getBoundingClientRect();\n  cssW = rect.width;\n  cssH = rect.height;\n  canvas.width = Math.max(1, Math.round(cssW * dpr));\n  canvas.height = Math.max(1, Math.round(cssH * dpr));\n  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);\n}\n\nfunction draw(elapsedSec) {\n  if (cssW === 0) return;\n  ctx.clearRect(0, 0, cssW, cssH);\n  if (!CONFIG.transparent) {\n    ctx.fillStyle = CONFIG.colors.bg;\n    ctx.fillRect(0, 0, cssW, cssH);\n  }\n\n  var S = Math.min(cssW, cssH);\n  var cx0 = cssW / 2, cy0 = cssH / 2;\n  var omega = (2 * Math.PI / BASE_PERIOD) * CONFIG.speed;\n  var phase = elapsedSec * omega + PHASE_OFFSET;\n  var rangePx = CONFIG.range * (S / REF_STAGE);\n  var layout = layoutFor(S, rangePx);\n  var focal = FOCAL_REF * (S / REF_STAGE);\n  var kSpread = layout.kMax - layout.kMin;\n\n  var order = [];\n  for (var i = 0; i < SPHERES.length; i++) {\n    var sph = SPHERES[i];\n    var w = spherePosition(sph, phase, rangePx);\n    var k = perspective(w.z, focal);\n    order.push({\n      index: i,\n      z: w.z,\n      x: cx0 + w.x * k * layout.fit,\n      y: cy0 + w.y * k * layout.fit,\n      radius: S * sph.radiusFrac * k * layout.fit,\n      depth: kSpread > 0 ? (k - layout.kMin) / kSpread : 1\n    });\n  }\n  order.sort(function (m, n) { return m.z - n.z; });\n\n  for (var d = 0; d < order.length; d++) {\n    var item = order[d];\n    var maxR = layout.maxRadius[item.index];\n    var sprite = sphereSprite(item.index, maxR, CONFIG.colors[SPHERES[item.index].key]);\n    var span = (maxR + SPRITE_PAD) * (item.radius / maxR);\n    ctx.globalAlpha = 0.84 + 0.16 * item.depth;\n    ctx.drawImage(sprite, item.x - span, item.y - span, span * 2, span * 2);\n  }\n  ctx.globalAlpha = 1;\n}\n\nfitCanvas();\nif (window.ResizeObserver) new ResizeObserver(fitCanvas).observe(canvas);\nelse window.addEventListener(\"resize\", fitCanvas);\n\nvar startTime = performance.now();\n(function tick(now) {\n  draw((now - startTime) / 1000);\n  requestAnimationFrame(tick);\n})(startTime);";

  // The exported page runs this very engine: the functions below are
  // serialized straight out of the running app, so an export can never
  // drift from what you were just watching. Settings ride along as CONFIG.
  function buildStandalonePage() {
    var config = {
      speed: state.speed,
      range: state.range,
      transparent: state.transparent,
      colors: {
        a: state.colors.a,
        b: state.colors.b,
        c: state.colors.c,
        bg: state.colors.bg
      }
    };

    var head = [
      "<!DOCTYPE html>",
      "<html lang=\"en\">",
      "<head>",
      "<meta charset=\"utf-8\">",
      "<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">",
      "<title>Driftloop</title>",
      "<style>",
      "  html, body { margin: 0; height: 100%; overflow: hidden;",
      "    background: " + (config.transparent ? "transparent" : config.colors.bg) + "; }",
      "  canvas { display: block; width: 100%; height: 100%; }",
      "</style>",
      "</head>",
      "<body>",
      "<canvas id=\"driftloop\"></canvas>",
      "<script>",
      "(function () {",
      "\"use strict\";"
    ].join("\n");

    var engine = [
      "var SPHERES = " + JSON.stringify(SPHERES) + ";",
      "var CLUSTER_MIN = " + CLUSTER_MIN + ";",
      "var BREATHE_WOBBLE = " + BREATHE_WOBBLE + ";",
      "var FOCAL_REF = " + FOCAL_REF + ";",
      "var REF_STAGE = " + REF_STAGE + ";",
      "var BASE_PERIOD = " + BASE_PERIOD + ";",
      "var PHASE_OFFSET = " + PHASE_OFFSET + ";",
      "var SPRITE_PAD = " + SPRITE_PAD + ";",
      "var CONFIG = " + JSON.stringify(config) + ";",
      "var layoutCache = { key: \"\", fit: 1, maxRadius: [], kMin: 1, kMax: 1 };",
      hexToRgb.toString(),
      mix.toString(),
      makeSphereSprite.toString(),
      spherePosition.toString(),
      perspective.toString(),
      layoutFor.toString(),
      EXPORT_RUNTIME
    ].join("\n\n");

    // nothing in the engine closes a script tag, but never ship markup
    // that could terminate the block it sits in
    engine = engine.replace(/<\//g, "<\\/");
    return head + "\n\n" + engine + "\n\n})();\n<\/script>\n</body>\n</html>\n";
  }

  function saveStandalonePage() {
    exportHint.textContent = "Saving…";
    downloadsCap.save({ filename: "driftloop.html", data: buildStandalonePage() })
      .then(function () {
        exportHint.textContent = "Saved a standalone page at these settings.";
        statusLive.textContent = "HTML page saved.";
      }).catch(function (err) {
        var code = err && err.code;
        if (code === "declined") {
          exportHint.textContent = "Save cancelled.";
        } else if (code === "rate_limited") {
          exportHint.textContent = "Too many recent prompts — try again shortly.";
        } else {
          exportHint.textContent = "Couldn't save the page in this view.";
        }
        statusLive.textContent = exportHint.textContent;
      });
  }

  exportBtn.addEventListener("click", function () {
    if (recording) return;
    if (!downloadsCap) {
      exportHint.textContent = "This view can't offer file downloads.";
      return;
    }
    if (!FORMATS[formatSelect.value].video) {
      saveStandalonePage();
      return;
    }
    if (!window.MediaRecorder) {
      exportHint.textContent = "This browser can't record video.";
      return;
    }
    var format = FORMATS[formatSelect.value];
    var mimeType = supportedMime(formatSelect.value);
    if (!mimeType) {
      exportHint.textContent = format.label + " recording isn't supported in this browser — try the other format.";
      return;
    }

    var loops = parseInt(loopsSelect.value, 10);
    var period = currentPeriod();
    recTargetMs = period * loops * 1000;

    var stream = canvas.captureStream(60);
    activeStream = stream;
    var chunks = [];
    var recorder;
    try {
      recorder = new MediaRecorder(stream, { mimeType: mimeType, videoBitsPerSecond: 6000000 });
    } catch (e) {
      exportHint.textContent = "Couldn't start the recorder in this browser.";
      return;
    }
    activeRecorder = recorder;
    cancelled = false;

    recorder.ondataavailable = function (e) {
      if (e.data && e.data.size) chunks.push(e.data);
    };

    recorder.onstop = function () {
      stream.getTracks().forEach(function (t) { t.stop(); });
      var wasOpaque = opaqueRecording;
      opaqueRecording = false;
      recording = false;
      setRailDisabled(false);
      recBadge.hidden = true;
      cancelBtn.hidden = true;
      updateExportButton();

      if (cancelled) {
        exportHint.textContent = "Recording cancelled.";
        statusLive.textContent = "Recording cancelled.";
        return;
      }

      var blob = new Blob(chunks, { type: mimeType.split(";")[0] });
      exportHint.textContent = "Saving…";
      downloadsCap.save({ filename: "driftloop." + format.ext, data: blob }).then(function () {
        var codec = codecLabel(mimeType);
        var saved = "Saved as " + format.label + ".";
        if (wasOpaque) saved += " It sits on the background colour, since browsers can't record transparent MP4.";
        if (format.ext === "mp4" && codec !== "H.264") {
          saved += " This browser has no H.264, so the MP4 uses " +
            (codec || "its default codec") +
            " — export WebM instead if an app won't open it.";
        }
        exportHint.textContent = saved;
        statusLive.textContent = "Video saved.";
      }).catch(function (err) {
        var code = err && err.code;
        if (code === "declined") {
          exportHint.textContent = "Save cancelled.";
        } else if (code === "rate_limited") {
          exportHint.textContent = "Too many recent prompts — try again shortly.";
        } else {
          exportHint.textContent = "Couldn't save the video in this view.";
        }
        statusLive.textContent = exportHint.textContent;
      });
    };

    opaqueRecording = state.transparent && format.ext !== "webm";
    recording = true;
    setRailDisabled(true);
    exportBtn.disabled = true;
    exportBtn.textContent = "Recording…";
    cancelBtn.hidden = false;
    recBadge.hidden = false;
    recTotalEl.textContent = (recTargetMs / 1000).toFixed(1) + "s";
    recTimeEl.textContent = "0.0s";
    exportHint.textContent = "Recording — don't resize the window.";
    statusLive.textContent = "Recording started.";

    recStartTime = performance.now();
    recorder.start();
    setTimeout(function () {
      if (recorder.state !== "inactive") recorder.stop();
    }, recTargetMs);
  });

  cancelBtn.addEventListener("click", function () {
    if (!recording || !activeRecorder) return;
    cancelled = true;
    if (activeRecorder.state !== "inactive") activeRecorder.stop();
  });
})();
</script>
</body>
</html>
